icon: mdi:grill
title: Heater Meter
cards: []
type: sections
sections:
  - type: grid
    cards:
      - entities:
          - entity: sensor.heater_meter_setpoint
          - entity: sensor.heater_meter_pit_temperature
          - entity: sensor.heater_meter_probe_1_temperature
          - entity: sensor.heater_meter_probe_2_temperature
          - entity: sensor.heater_meter_probe_3_temperature
          - entity: sensor.heater_meter_fan
        hours_to_show: 18
        refresh_interval: 10
        type: history-graph
        grid_options:
          columns: full
    column_span: 4
  - type: grid
    cards:
      # ponytail: fixed low & slow zones; a gauge that follows the setpoint needs a custom card
      - type: gauge
        entity: sensor.heater_meter_pit_temperature
        name: Pit
        min: 0
        max: 300
        needle: true
        segments:
          - from: 0
            color: "#3b82f6"
          - from: 100
            color: "#22c55e"
          - from: 150
            color: "#f59e0b"
          - from: 200
            color: "#ef4444"
        grid_options:
          columns: 12
      - entities:
          - entity: sensor.heater_meter_setpoint
          - entity: sensor.heater_meter_lid
          - entity: sensor.heater_meter_fan
          - entity: sensor.heater_meter_pit_temperature
          - entity: sensor.heater_meter_probe_1_temperature
            name: Food-1 Temperature
          - type: conditional
            conditions: &probe2
              - condition: state
                entity: sensor.heater_meter_probe_2_temperature
                state_not: unavailable
            row:
              entity: sensor.heater_meter_probe_2_temperature
              name: Food-2 Temperature
          - type: conditional
            conditions: &probe3
              - condition: state
                entity: sensor.heater_meter_probe_3_temperature
                state_not: unavailable
            row:
              entity: sensor.heater_meter_probe_3_temperature
              name: Food-3 Temperature
          - entity: sensor.heater_meter_alarm
        show_header_toggle: false
        title: Smoker
        type: entities
        grid_options:
          columns: 12
          rows: 7
      - entities:
          - type: section
            label: Pit temperature
          - entity: input_number.p0h
            name: "Hi:"
          - entity: input_number.p0l
            name: "Lo:"
          - type: section
            label: Food-1
          - entity: input_number.p1h
            name: "Hi:"
          - entity: input_number.p1l
            name: "Lo:"
          - type: conditional
            conditions: *probe2
            row:
              type: section
              label: Food-2
          - type: conditional
            conditions: *probe2
            row:
              entity: input_number.p2h
              name: "Hi:"
          - type: conditional
            conditions: *probe2
            row:
              entity: input_number.p2l
              name: "Lo:"
          - type: conditional
            conditions: *probe3
            row:
              type: section
              label: Food-3
          - type: conditional
            conditions: *probe3
            row:
              entity: input_number.p3h
              name: "Hi:"
          - type: conditional
            conditions: *probe3
            row:
              entity: input_number.p3l
              name: "Lo:"
          - type: section
          - action_name: Set
            icon: mdi:blank
            name: " "
            service: script.heatermeter_set_alarms
            type: call-service
        title: Alarms
        type: entities
        grid_options:
          columns: 12
          rows: 13
      - entities:
          - entity: input_number.setpoint
            name: "New Set Point:"
        title: Change Set Point
        type: entities
        grid_options:
          columns: 12
          rows: 2
      - entities:
          - entity: input_text.host
            name: "Heatermeter hostname of IP-address:"
            icon: mdi:server
          - entity: input_text.api_key
            name: Heatermeter API key
            icon: mdi:key
        title: Configuration
        type: entities
        # Shows the API key in plain text. To show this card to admins only, uncomment and
        # fill in your user ID (Settings > People > Users, with advanced mode on):
        # visibility:
        #   - condition: user
        #     users:
        #       - <admin-user-id>
        grid_options:
          columns: 12
          rows: 4
    column_span: 4
max_columns: 4
dense_section_placement: true
